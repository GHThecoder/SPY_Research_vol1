[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-alpha-research"
version = "0.3.0"
description = "Interpretable Feature Attribution and Alpha Validation for SPY Return Dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary Source-Available — Copyright © 2026. All rights reserved." }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "torch>=2.0",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
