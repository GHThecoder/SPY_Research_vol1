arima:
  order_grid:
    - [1, 0, 0]
    - [1, 0, 1]
    - [2, 0, 1]
    - [1, 0, 2]
  max_iter: 200

trees:
  random_forest:
    n_estimators: 200
    max_depth: 6
    min_samples_leaf: 20
    n_jobs: -1
  hist_gbm:
    max_depth: 4
    learning_rate: 0.05
    max_iter: 200
    l2_regularization: 0.1

pca_kernel:
  n_components: 8
  ridge_alpha: 1.0
  elasticnet_alpha: 0.001
  elasticnet_l1_ratio: 0.5
  kernel_ridge_alpha: 1.0
  kernel_ridge_gamma: null   # null => 1 / n_features
  svr_C: 1.0
  svr_epsilon: 0.01
  svr_gamma: scale

cnn:
  lookback: 32
  channels: [ret, vol_21, volume_z]
  conv_channels: [16, 32]
  kernel_size: 3
  embed_dim: 8
  dropout: 0.1
  epochs: 15
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
